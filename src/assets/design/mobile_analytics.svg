<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="anaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldKpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="360" height="640" rx="36" fill="url(#anaBg)" />
  <text x="28" y="24" fill="#ffffff" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">9:41</text>
  <rect x="135" y="12" width="90" height="22" rx="11" fill="#000000" />

  <text x="24" y="65" fill="#facc15" font-size="11" font-family="sans-serif" font-weight="600" letter-spacing="1">EKSEKUTIF KPI</text>
  <text x="24" y="90" fill="#ffffff" font-size="20" font-family="sans-serif" font-weight="800">Analitik Penjualan</text>

  <!-- Big Revenue Card -->
  <g transform="translate(24, 115)">
    <rect width="312" height="135" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(234,179,8,0.3)" />
    <text x="20" y="32" fill="#a1a1aa" font-size="11" font-family="sans-serif">Omset Penjualan Hari Ini</text>
    <text x="20" y="70" fill="#ffffff" font-size="32" font-family="sans-serif" font-weight="900">Rp 14.850.000</text>
    
    <rect x="20" y="85" width="80" height="22" rx="6" fill="#22c55e" fill-opacity="0.2" />
    <text x="28" y="100" fill="#4ade80" font-size="11" font-family="sans-serif" font-weight="700">▲ +24.8% vs kemarin</text>

    <!-- Mini chart line -->
    <path d="M 180 100 Q 210 70 230 85 T 260 55 T 290 60" fill="none" stroke="#facc15" stroke-width="2.5" />
    <circle cx="290" cy="60" r="4" fill="#facc15" />
  </g>

  <!-- 2 Metric split cards -->
  <g transform="translate(24, 265)">
    <rect x="0" y="0" width="148" height="85" rx="16" fill="rgba(255,255,255,0.04)" />
    <text x="14" y="26" fill="#a1a1aa" font-size="10" font-family="sans-serif">Total Transaksi</text>
    <text x="14" y="56" fill="#38bdf8" font-size="24" font-family="sans-serif" font-weight="800">86 Order</text>
    <text x="14" y="74" fill="#38bdf8" font-size="9" font-family="sans-serif">4.2 order/jam</text>

    <rect x="164" y="0" width="148" height="85" rx="16" fill="rgba(255,255,255,0.04)" />
    <text x="178" y="26" fill="#a1a1aa" font-size="10" font-family="sans-serif">Rata-rata Order</text>
    <text x="178" y="56" fill="#ec4899" font-size="24" font-family="sans-serif" font-weight="800">172rb</text>
    <text x="178" y="74" fill="#ec4899" font-size="9" font-family="sans-serif">Basket size 2.1 item</text>
  </g>

  <!-- Hourly Trajectory Chart -->
  <g transform="translate(24, 365)">
    <rect width="312" height="135" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
    <text x="16" y="26" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="700">Grafik Penjualan Per Jam</text>
    <!-- Bar charts -->
    <g transform="translate(20, 50)">
      <rect x="0" y="35" width="16" height="35" rx="3" fill="#3f3f46" />
      <rect x="25" y="20" width="16" height="50" rx="3" fill="#3f3f46" />
      <rect x="50" y="10" width="16" height="60" rx="3" fill="#facc15" />
      <rect x="75" y="30" width="16" height="40" rx="3" fill="#3f3f46" />
      <rect x="100" y="15" width="16" height="55" rx="3" fill="#3f3f46" />
      <rect x="125" y="5" width="16" height="65" rx="3" fill="#facc15" />
      <rect x="150" y="25" width="16" height="45" rx="3" fill="#3f3f46" />
      <rect x="175" y="12" width="16" height="58" rx="3" fill="#facc15" />
      <rect x="200" y="18" width="16" height="52" rx="3" fill="#3f3f46" />
      <rect x="225" y="8" width="16" height="62" rx="3" fill="#facc15" />
      <rect x="250" y="30" width="16" height="40" rx="3" fill="#3f3f46" />
    </g>
    <text x="16" y="122" fill="#71717a" font-size="9" font-family="sans-serif">Peak Jam 12:00 &amp; 19:00 WIB (Waktu Makan Siang &amp; Santai)</text>
  </g>

  <!-- Export Report Button -->
  <g transform="translate(24, 520)">
    <rect width="312" height="48" rx="14" fill="url(#goldKpi)" />
    <text x="85" y="29" fill="#000000" font-size="13" font-family="sans-serif" font-weight="800">Unduh Rekap Laporan PDF</text>
  </g>

  <rect x="120" y="624" width="120" height="4" rx="2" fill="rgba(255,255,255,0.3)" />
</svg>