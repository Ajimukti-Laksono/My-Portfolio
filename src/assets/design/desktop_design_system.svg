<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="20" fill="url(#sysBg)" />
  
  <!-- Browser Header -->
  <rect width="640" height="34" fill="#1e293b" rx="20" />
  <rect y="20" width="640" height="14" fill="#1e293b" />
  <circle cx="24" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#10b981" />
  <rect x="180" y="7" width="280" height="20" rx="6" fill="#0f172a" />
  <text x="210" y="21" fill="#94a3b8" font-size="10" font-family="monospace">figma.com/@aji/batik-design-system</text>

  <!-- Sidebar -->
  <rect x="0" y="34" width="140" height="366" fill="#111827" />
  <text x="16" y="60" fill="#6366f1" font-size="11" font-family="sans-serif" font-weight="700">DESIGN TOKENS</text>
  <text x="16" y="85" fill="#ffffff" font-size="11" font-family="sans-serif">❖ Color Palette</text>
  <text x="16" y="110" fill="#94a3b8" font-size="11" font-family="sans-serif">❖ Typography Scale</text>
  <text x="16" y="135" fill="#94a3b8" font-size="11" font-family="sans-serif">❖ Shadows & Blur</text>
  <text x="16" y="160" fill="#94a3b8" font-size="11" font-family="sans-serif">❖ Spacing System</text>

  <text x="16" y="195" fill="#6366f1" font-size="11" font-family="sans-serif" font-weight="700">COMPONENTS</text>
  <text x="16" y="220" fill="#94a3b8" font-size="11" font-family="sans-serif">❖ Buttons (Primary)</text>
  <text x="16" y="245" fill="#94a3b8" font-size="11" font-family="sans-serif">❖ Input & Forms</text>
  <text x="16" y="270" fill="#94a3b8" font-size="11" font-family="sans-serif">❖ Modals & Toasts</text>
  <text x="16" y="295" fill="#94a3b8" font-size="11" font-family="sans-serif">❖ Cards & Banners</text>

  <!-- Main Canvas -->
  <g transform="translate(160, 50)">
    <text x="0" y="20" fill="#ffffff" font-size="18" font-family="sans-serif" font-weight="800">Batik Nusantara Design System v2.4</text>
    <text x="0" y="38" fill="#94a3b8" font-size="11" font-family="sans-serif">Library Komponen Figma & Token CSS Sinkron</text>

    <!-- Color chips row -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="85" height="55" rx="8" fill="#6366f1" />
      <text x="8" y="44" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="700">Indigo #6366F1</text>

      <rect x="95" y="0" width="85" height="55" rx="8" fill="#f59e0b" />
      <text x="103" y="44" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="700">Amber #F59E0B</text>

      <rect x="190" y="0" width="85" height="55" rx="8" fill="#10b981" />
      <text x="198" y="44" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="700">Emerald #10B981</text>

      <rect x="285" y="0" width="85" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="293" y="44" fill="#94a3b8" font-size="9" font-family="sans-serif" font-weight="700">Slate #0F172A</text>

      <rect x="380" y="0" width="80" height="55" rx="8" fill="#38bdf8" />
      <text x="388" y="44" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="700">Cyan #38BDF8</text>
    </g>

    <!-- Interactive Component Variants Showcase -->
    <g transform="translate(0, 130)">
      <rect width="460" height="195" rx="14" fill="#1e293b" fill-opacity="0.6" stroke="rgba(255,255,255,0.08)" />
      <text x="20" y="30" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="700">Component Matrix: Button & Input States</text>

      <!-- Row 1: Button variants -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="95" height="34" rx="8" fill="#6366f1" />
        <text x="24" y="22" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="700">Primary</text>

        <rect x="110" y="0" width="95" height="34" rx="8" fill="#10b981" />
        <text x="130" y="22" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="700">Success</text>

        <rect x="220" y="0" width="95" height="34" rx="8" fill="none" stroke="#6366f1" stroke-width="1.5" />
        <text x="244" y="22" fill="#6366f1" font-size="11" font-family="sans-serif" font-weight="700">Outline</text>

        <rect x="330" y="0" width="95" height="34" rx="8" fill="#334155" />
        <text x="352" y="22" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="700">Disabled</text>
      </g>

      <!-- Row 2: Inputs -->
      <g transform="translate(20, 105)">
        <rect x="0" y="0" width="205" height="38" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
        <text x="14" y="24" fill="#ffffff" font-size="11" font-family="sans-serif">input.focused | active</text>

        <rect x="220" y="0" width="205" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="234" y="24" fill="#64748b" font-size="11" font-family="sans-serif">Cari komponen...</text>
      </g>

      <!-- Stats pills -->
      <g transform="translate(20, 160)">
        <text x="0" y="16" fill="#94a3b8" font-size="10" font-family="sans-serif">❖ 48 Master Components • 120+ Variants • 100% WCAG AAA Compliant</text>
      </g>
    </g>
  </g>
</svg>