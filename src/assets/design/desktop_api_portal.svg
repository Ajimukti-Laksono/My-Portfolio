<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="20" fill="url(#apiBg)" />
  <rect width="640" height="34" fill="#1e293b" rx="20" />
  <rect y="20" width="640" height="14" fill="#1e293b" />
  <circle cx="24" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#10b981" />
  <rect x="180" y="7" width="280" height="20" rx="6" fill="#0f172a" />
  <text x="200" y="21" fill="#94a3b8" font-size="10" font-family="monospace">console.devpulse.io/webhooks/live</text>

  <!-- Sidebar -->
  <rect x="0" y="34" width="140" height="366" fill="#090d16" />
  <text x="16" y="65" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="700">DEVELOPER API</text>
  <text x="16" y="90" fill="#ffffff" font-size="11" font-family="sans-serif">⚡ Live Webhooks</text>
  <text x="16" y="115" fill="#94a3b8" font-size="11" font-family="sans-serif">⚡ SSE Endpoints</text>
  <text x="16" y="140" fill="#94a3b8" font-size="11" font-family="sans-serif">⚡ Event Logs</text>
  <text x="16" y="165" fill="#94a3b8" font-size="11" font-family="sans-serif">⚡ Security Keys</text>

  <!-- Content -->
  <g transform="translate(160, 50)">
    <text x="0" y="20" fill="#ffffff" font-size="18" font-family="sans-serif" font-weight="800">GitHub Webhook Dispatcher</text>
    <text x="0" y="38" fill="#94a3b8" font-size="11" font-family="sans-serif">Pemantauan Endpoint Otomatis &amp; Retry Mekanisme</text>

    <!-- Terminal Code Box -->
    <g transform="translate(0, 55)">
      <rect width="460" height="270" rx="12" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Code lines -->
      <text x="20" y="30" fill="#22c55e" font-size="11" font-family="monospace">HTTP 200 OK — POST /api/webhooks/github</text>
      <text x="20" y="55" fill="#94a3b8" font-size="11" font-family="monospace">Headers: X-GitHub-Event: "push"</text>
      <text x="20" y="80" fill="#94a3b8" font-size="11" font-family="monospace">Payload: { "ref": "refs/heads/main", "commits": 3 }</text>
      
      <line x1="20" y1="95" x2="440" y2="95" stroke="#1e293b" />

      <text x="20" y="120" fill="#38bdf8" font-size="11" font-family="monospace">✓ Verified SHA-256 Signature (HMAC valid)</text>
      <text x="20" y="145" fill="#38bdf8" font-size="11" font-family="monospace">✓ Broadcasted event to 8 active SSE clients</text>
      <text x="20" y="170" fill="#a855f7" font-size="11" font-family="monospace">✓ Prisma SQLite commit record saved in 12ms</text>
      
      <!-- Status pill -->
      <rect x="20" y="210" width="110" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="32" y="228" fill="#34d399" font-size="11" font-family="sans-serif" font-weight="700">STATUS: HEALTHY</text>

      <text x="150" y="228" fill="#64748b" font-size="11" font-family="sans-serif">Latency: 28ms • Uptime: 99.98%</text>
    </g>
  </g>
</svg>