<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="640" rx="36" fill="url(#bgGrad1)" />
  
  <!-- Subtle Grid Overlay -->
  <path d="M 0 100 H 360 M 0 200 H 360 M 0 300 H 360 M 0 400 H 360 M 0 500 H 360" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Phone Status Bar -->
  <text x="28" y="24" fill="#ffffff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">9:41</text>
  <!-- Dynamic Island -->
  <rect x="135" y="12" width="90" height="22" rx="11" fill="#000000" />
  <circle cx="205" cy="23" r="3.5" fill="#1e293b" />
  <!-- Battery & Wifi -->
  <rect x="306" y="14" width="22" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1.2" />
  <rect x="308" y="16" width="14" height="7" rx="1.5" fill="#ffffff" />
  <path d="M 285 24 A 10 10 0 0 1 297 14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="270" cy="22" r="2.5" fill="#ffffff" />

  <!-- App Header -->
  <text x="24" y="65" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500" letter-spacing="1">BATIK NUSANTARA</text>
  <text x="24" y="90" fill="#ffffff" font-size="20" font-family="sans-serif" font-weight="800">Koleksi Warisan</text>
  
  <!-- Profile Icon & Cart -->
  <circle cx="316" cy="76" r="18" fill="rgba(255,255,255,0.08)" />
  <circle cx="316" cy="73" r="6" fill="#f59e0b" />
  <path d="M 307 88 C 307 81, 325 81, 325 88" fill="#f59e0b" />

  <!-- Search Bar -->
  <rect x="24" y="108" width="312" height="40" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="44" cy="128" r="6" fill="none" stroke="#94a3b8" stroke-width="1.8" />
  <line x1="49" y1="133" x2="56" y2="140" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
  <text x="66" y="133" fill="#64748b" font-size="12" font-family="sans-serif">Cari motif Mega Mendung, Parang...</text>

  <!-- Hero Promo Card -->
  <g transform="translate(24, 162)">
    <rect width="312" height="140" rx="18" fill="url(#cardGrad1)" />
    <!-- Decorative batik floral lines -->
    <path d="M 200 140 Q 240 50 312 40 L 312 140 Z" fill="rgba(0,0,0,0.18)" />
    <circle cx="270" cy="60" r="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <rect x="16" y="16" width="76" height="20" rx="10" fill="#000000" fill-opacity="0.25" />
    <text x="24" y="30" fill="#fef3c7" font-size="9" font-family="sans-serif" font-weight="700" letter-spacing="1">EKSKLUSIF</text>
    
    <text x="16" y="66" fill="#ffffff" font-size="18" font-family="sans-serif" font-weight="800">Batik Tulis Solo</text>
    <text x="16" y="86" fill="rgba(255,255,255,0.85)" font-size="11" font-family="sans-serif">Diskon 30% Spesial Hari Ini</text>
    
    <!-- CTA Button -->
    <rect x="16" y="98" width="100" height="28" rx="8" fill="#ffffff" />
    <text x="32" y="116" fill="#b45309" font-size="11" font-family="sans-serif" font-weight="700">Beli Sekarang</text>
  </g>

  <!-- Categories -->
  <text x="24" y="332" fill="#ffffff" font-size="14" font-family="sans-serif" font-weight="700">Kategori Pilihan</text>
  
  <g transform="translate(24, 346)">
    <!-- Cat 1 -->
    <rect x="0" y="0" width="70" height="32" rx="10" fill="#4f46e5" />
    <text x="16" y="20" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="600">Semua</text>
    <!-- Cat 2 -->
    <rect x="78" y="0" width="74" height="32" rx="10" fill="rgba(255,255,255,0.06)" />
    <text x="96" y="20" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Parang</text>
    <!-- Cat 3 -->
    <rect x="160" y="0" width="94" height="32" rx="10" fill="rgba(255,255,255,0.06)" />
    <text x="174" y="20" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Mega Mendung</text>
    <!-- Cat 4 -->
    <rect x="262" y="0" width="50" height="32" rx="10" fill="rgba(255,255,255,0.06)" />
    <text x="272" y="20" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Kawung</text>
  </g>

  <!-- Product Grid (2 Columns) -->
  <g transform="translate(24, 396)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="148" height="175" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" />
    <!-- Product Image Area -->
    <rect x="8" y="8" width="132" height="95" rx="12" fill="#1e293b" />
    <!-- Batik pattern motif representation -->
    <path d="M 20 50 Q 74 15 128 50 Q 74 85 20 50 Z" fill="none" stroke="#f59e0b" stroke-width="2" />
    <circle cx="74" cy="50" r="14" fill="#d97706" opacity="0.6" />
    <text x="14" y="122" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="700">Batik Parang Rusak</text>
    <text x="14" y="137" fill="#94a3b8" font-size="10" font-family="sans-serif">Kemeja Sutra Pria</text>
    <text x="14" y="158" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="800">Rp 385.000</text>
    <circle cx="130" cy="154" r="12" fill="#4f46e5" />
    <path d="M 126 154 H 134 M 130 150 V 158" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

    <!-- Product 2 -->
    <rect x="164" y="0" width="148" height="175" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" />
    <!-- Product Image Area -->
    <rect x="172" y="8" width="132" height="95" rx="12" fill="#1e293b" />
    <!-- Cloud motif representation -->
    <path d="M 185 60 C 185 45, 210 40, 225 50 C 235 35, 265 40, 275 55 C 290 55, 295 70, 280 75 Z" fill="#6366f1" opacity="0.6" />
    <text x="178" y="122" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="700">Mega Mendung Biru</text>
    <text x="178" y="137" fill="#94a3b8" font-size="10" font-family="sans-serif">Blouse Wanita Katun</text>
    <text x="178" y="158" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="800">Rp 295.000</text>
    <circle cx="294" cy="154" r="12" fill="#4f46e5" />
    <path d="M 290 154 H 298 M 294 150 V 158" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 584)">
    <rect width="360" height="56" fill="rgba(15,23,42,0.92)" />
    <line x1="0" y1="0" x2="360" y2="0" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Nav item 1 (Active) -->
    <circle cx="45" cy="22" r="4" fill="#6366f1" />
    <text x="33" y="38" fill="#6366f1" font-size="9" font-family="sans-serif" font-weight="700">Home</text>

    <!-- Nav item 2 -->
    <circle cx="135" cy="20" r="7" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="117" y="38" fill="#64748b" font-size="9" font-family="sans-serif">Eksplor</text>

    <!-- Nav item 3 -->
    <rect x="220" y="14" width="14" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="211" y="38" fill="#64748b" font-size="9" font-family="sans-serif">Keranjang</text>

    <!-- Nav item 4 -->
    <circle cx="315" cy="18" r="6" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="303" y="38" fill="#64748b" font-size="9" font-family="sans-serif">Akun</text>

    <!-- Home indicator bar -->
    <rect x="120" y="48" width="120" height="4" rx="2" fill="rgba(255,255,255,0.4)" />
  </g>
</svg>